name: Refresh live matches

# Refreshes every in-play match (scores/events/stats/lineups) from API-Football
# so the site stays current without anyone holding a match page open. Hits the
# app's seed endpoint (step=live) during the tournament.
#
# ⚠️ SCHEDULE DISABLED (2026-06-12): live refresh is now driven by an external
# pinger (cron-job.org) hitting POST /api/seed?step=live every 2 min — a true
# 2-min cadence that GitHub's ~5-min scheduled-workflow floor can't match. This
# workflow's cron was therefore redundant AND was failing every run (the
# REVALIDATE_SECRET Actions secret isn't set), spamming failure emails. The
# schedule is removed; the job is kept as workflow_dispatch-only so it can still
# be triggered manually for testing. To restore automated runs, add the
# REVALIDATE_SECRET (and optional APP_URL) Actions secrets and re-add the cron
# block below — but prefer cron-job.org for the tighter cadence.
#
# Setup for manual dispatch — same secrets as the wcstats workflow:
#   Repo Settings -> Secrets and variables -> Actions:
#     REVALIDATE_SECRET  = the same value as the app's REVALIDATE_SECRET env var
#     APP_URL (optional) = production base URL; otherwise edit the default below

on:
  # schedule:  # disabled — cron-job.org drives live refresh (see note above)
  #   - cron: "*/2 * 11-30 6 *"
  #   - cron: "*/2 * 1-19 7 *"
  workflow_dispatch: # manual runs for testing

concurrency:
  group: live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger live refresh (within tournament window)
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://wc2026-tracker.vercel.app' }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          # Skip outside the 2026 tournament window (manual dispatch always runs).
          # [[ ]] does lexicographic comparison, which is correct for ISO dates.
          if [[ "${{ github.event_name }}" == "schedule" && ( "$today" < "2026-06-11" || "$today" > "2026-07-19" ) ]]; then
            echo "Outside tournament window ($today); skipping."
            exit 0
          fi
          if [ -z "${REVALIDATE_SECRET:-}" ]; then
            echo "REVALIDATE_SECRET secret is not set; aborting." >&2
            exit 1
          fi
          echo "Refreshing live matches via $APP_URL ..."
          curl -fsS -X POST "$APP_URL/api/seed?step=live" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            --max-time 300
