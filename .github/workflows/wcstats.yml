name: Seed WC stats

# Aggregates WC 2026 player stats (and match results) by hitting the app's seed
# endpoint (step=wcstats) during the tournament — this is what keeps /stats and
# the player-profile WC sections self-updating after each match.
#
# ⚠️ SCHEDULE DISABLED (2026-06-12): like the live-refresh workflow, this cron was
# failing every run because the REVALIDATE_SECRET Actions secret isn't set, and
# the failures emailed on a 30-min cadence. Automation has moved to an external
# pinger (cron-job.org) hitting POST /api/seed?step=wcstats every 30 min with the
# `Authorization: Bearer <REVALIDATE_SECRET>` header — the same setup already in
# use for step=live. The schedule is removed; the job is kept as
# workflow_dispatch-only for manual testing. To restore GitHub-driven runs, add
# the REVALIDATE_SECRET (and optional APP_URL) Actions secrets and re-add the
# cron block below.
#
# Setup for manual dispatch:
#   Repo Settings -> Secrets and variables -> Actions:
#     REVALIDATE_SECRET  = the same value as the app's REVALIDATE_SECRET env var
#     APP_URL (optional) = production base URL; otherwise edit the default below

on:
  # schedule:  # disabled — cron-job.org drives wcstats (see note above)
  #   - cron: "*/30 * 11-30 6 *"
  #   - cron: "*/30 * 1-19 7 *"
  workflow_dispatch: # manual runs for testing

concurrency:
  group: wcstats
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger wcstats seed (within tournament window)
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://wc2026-tracker.vercel.app' }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          # Skip outside the 2026 tournament window (manual dispatch always runs).
          # [[ ]] does lexicographic comparison, which is correct for ISO dates.
          if [[ "${{ github.event_name }}" == "schedule" && ( "$today" < "2026-06-11" || "$today" > "2026-07-19" ) ]]; then
            echo "Outside tournament window ($today); skipping."
            exit 0
          fi
          if [ -z "${REVALIDATE_SECRET:-}" ]; then
            echo "REVALIDATE_SECRET secret is not set; aborting." >&2
            exit 1
          fi
          echo "Seeding wcstats via $APP_URL ..."
          curl -fsS -X POST "$APP_URL/api/seed?step=wcstats" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            --max-time 300
